name: Go and Python CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go tests, vet and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check dashboard JavaScript syntax
        run: node --check internal/web/static/app.js && node --check internal/web/static/research-lab.js
      - name: Run tests
        run: go test -count=1 ./...
      - name: Run vet
        run: go vet ./...
      - name: Build all packages
        run: go build ./...
  python:
    name: Python scanner tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner dependencies
        run: pip install -r requirements.txt
      - name: Run scanner unit tests
        run: python -m pytest -q
